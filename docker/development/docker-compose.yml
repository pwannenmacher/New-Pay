services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: newpay-frontend
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - newpay-network
    restart: unless-stopped

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: newpay-api
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Server
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      
      # Database - override host for Docker network
      DB_HOST: postgres
      
      # SMTP - override host for Docker network
      SMTP_HOST: mailpit
      SMTP_PORT: 1025

      # Encryption
      ENCRYPTION_MASTER_KEY: 5efb2b525d24d5d380b8c8c189e35448de54579b3b81d2256858eb18c379e70f

      # LLM - override host for Docker network
      LLM_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - newpay-network
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: newpay-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - newpay-network

  ollama:
    image: ollama/ollama:latest
    container_name: newpay-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - newpay-network

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - mailpit:/data
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: true
      MP_SMTP_AUTH_ALLOW_INSECURE: true
      MP_VERBOSE: false
    networks:
      - newpay-network

networks:
  newpay-network:
    driver: bridge

volumes:
  postgres:
  mailpit:
  ollama:
